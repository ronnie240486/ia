<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Imagens IA</title>
<style>
body { font-family: sans-serif; padding: 20px; }
h1 { color: #333; }
input, select, button { padding: 8px; margin: 5px; font-size: 16px; }
#result img { max-width: 500px; margin-top: 20px; border:1px solid #ccc; }
</style>
</head>
<body>
<h1>Gerador de Imagens IA - 20 Modelos</h1>

<input type="text" id="prompt" placeholder="Digite o prompt" size="40">
<select id="model">
  <option value="pollinations">Pollinations</option>
  <option value="pollinations-v2">Pollinations V2</option>
  <option value="pollinations-legacy">Pollinations Legacy</option>
  <option value="picsum">Picsum</option>
  <option value="placeholder">Placeholder.com</option>
  <option value="placehold-co">Placehold.co</option>
  <option value="picsum-gray">Picsum Grayscale</option>
  <option value="picsum-blur">Picsum Blur</option>
  <option value="dummyimage">DummyImage</option>
  <option value="placeimg">Placeimg</option>
  <option value="place-text">Place Text</option>
  <option value="bacon">Bacon Mockup</option>
  <option value="placebear">Place Bear</option>
  <option value="kitten">PlaceKitten</option>
  <option value="fox">Random Fox</option>
  <option value="fakeface">FakeFace</option>
  <option value="placecorgi">PlaceCorgi</option>
  <option value="placebeard">PlaceBeard</option>
  <option value="placecat">Random Cat</option>
  <option value="placedog">Random Dog</option>
</select>
<button onclick="gerar()">Gerar</button>

<div id="result"></div>

<script>
async function gerar() {
  const prompt = document.getElementById("prompt").value;
  const model = document.getElementById("model").value;
  const result = document.getElementById("result");
  result.innerHTML = "<p>Gerando imagem...</p>";

  try {
    const res = await fetch("/generate-image", {
      method:"POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({prompt, model})
    });
    const data = await res.json();
    if (!data.success) { result.innerHTML = "<p>Erro: "+data.error+"</p>"; return; }
    result.innerHTML = `<img src="${data.imageUrl}" alt="Imagem gerada"/>`;
  } catch(err){
    result.innerHTML = "<p>Erro: "+err.message+"</p>";
  }
}
</script>
</body>
</html>
